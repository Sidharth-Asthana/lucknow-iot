# Home Assistant — Main Configuration
# Lucknow Smart Residence · Mac Mini A · 10.0.0.10
# Place this file at: volumes/ha_config/configuration.yaml

homeassistant:
  name: "Lucknow Smart Residence"
  latitude: 26.8467
  longitude: 80.9462
  elevation: 123        # metres ASL
  unit_system: metric
  currency: INR
  country: IN
  time_zone: Asia/Kolkata
  # external_url: "http://10.0.0.10:8123"  # uncomment on Mac Mini production

# ── Core integrations loaded by default ──────────────────────────────────────
default_config:          # includes frontend, history, logbook, map, mobile_app, etc.

# ── Lovelace — load dashboard from file (no UI editor needed) ────────────────
lovelace:
  mode: yaml             # reads ui-lovelace.yaml from this config directory

# ── Split configs ─────────────────────────────────────────────────────────────
modbus: !include modbus.yaml
mqtt:   !include mqtt_sensors.yaml
automation: !include_dir_merge_list automations/
script:     !include scripts.yaml

# ── Hardware integrations (configured via UI, not YAML) ──────────────────────
# These integrations moved to UI-only in recent HA versions.
# Add them via Settings → Devices & Services → + Add Integration when hardware is present.
#
# KNX:       search "KNX" → Tunneling → host 10.0.0.20 port 3671
# Konnected: search "Konnected" → host 10.0.0.30 (security) + 10.0.0.31 (elevator)
# NUT (UPS): search "Network UPS Tools" → host localhost

# ── Alarm Control Panel ───────────────────────────────────────────────────────
alarm_control_panel:
  - platform: manual
    name: Main Alarm
    code_arm_required: false
    disarm_after_trigger: false
    arming_time: 30          # 30 s exit delay
    delay_time: 20           # 20 s entry grace
    trigger_time: 300        # siren runs for 5 min max

# ── Template sensors ──────────────────────────────────────────────────────────
template:
  - sensor:
      # Elevator floor — derives a friendly string from Konnected zone states
      - name: "Elevator Floor"
        unique_id: elevator_floor
        state: >
          {% if is_state('binary_sensor.elevator_at_ground', 'on') %}
            Ground
          {% elif is_state('binary_sensor.elevator_at_first', 'on') %}
            First
          {% elif is_state('binary_sensor.elevator_at_terrace', 'on') %}
            Terrace
          {% else %}
            In Transit
          {% endif %}
        icon: mdi:elevator

      # Cooling delta — outdoor minus beehive inlet temperature
      - name: "Cooling Delta C"
        unique_id: cooling_delta_c
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set outdoor = states('sensor.outdoor_temp_c') | float(0) %}
          {% set inlet   = states('sensor.beehive_inlet_temp_c') | float(0) %}
          {{ (outdoor - inlet) | round(1) }}
        icon: mdi:thermometer-lines

      # RWH level in litres
      - name: "RWH Level Litres"
        unique_id: rwh_level_litres
        unit_of_measurement: "L"
        state: >
          {{ (states('sensor.rwh_level_pct') | float(0) / 100 * 18000) | round(0) | int }}
        icon: mdi:water

  - binary_sensor:
      - name: "RWH Low Level"
        unique_id: rwh_low_level
        device_class: problem
        state: "{{ states('sensor.rwh_level_pct') | float(100) < 10 }}"

# ── Simulated Modbus / Konnected sensors (dev mode — no hardware required) ─────
# Named with sim_ prefix — never conflict with real Modbus/Konnected entities.
# Used by dashboard/lovelace-dev.yaml. Hardware dashboards use the real entities.
template:
  - sensor:
      # PV power: bell curve peaking at noon (5800 W)
      - name: "Sim PV Power W"
        unique_id: sim_pv_power_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set h = now().hour + now().minute / 60 %}
          {% if h >= 6 and h <= 18 %}
            {% set x = (h - 12) / 5.5 %}
            {{ [0, (5800 * (1 - x * x)) | round(0)] | max | int }}
          {% else %}
            0
          {% endif %}
        icon: mdi:solar-power

      # Battery SOC: ramp charge 6am–3pm, discharge rest of day
      - name: "Sim Battery SOC Pct"
        unique_id: sim_battery_soc_pct
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: >
          {% set h = now().hour + now().minute / 60 %}
          {% if h >= 6 and h <= 15 %}
            {{ [100, (40 + (h - 6) / 9 * 55) | round(1)] | min }}
          {% else %}
            {% set dh = ((h - 15 + 24) % 24) %}
            {{ [5, (95 - dh / 15 * 55) | round(1)] | max }}
          {% endif %}
        icon: mdi:battery-charging

      # Grid import W (positive = taking from grid)
      - name: "Sim Grid Import W"
        unique_id: sim_grid_import_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set pv = states('sensor.sim_pv_power_w') | float(0) %}
          {{ [0, (1200 - pv) | round(0)] | max | int }}
        icon: mdi:transmission-tower-import

      # Grid export W (positive = sending to grid)
      - name: "Sim Grid Export W"
        unique_id: sim_grid_export_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set pv = states('sensor.sim_pv_power_w') | float(0) %}
          {{ [0, (pv - 1200) | round(0)] | max | int }}
        icon: mdi:transmission-tower-export

      # Inverter AC output (5 kW rated max)
      - name: "Sim Inverter AC Output W"
        unique_id: sim_inverter_ac_output_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {{ [5000, states('sensor.sim_pv_power_w') | float(0)] | min | int }}
        icon: mdi:lightning-bolt

      # AC voltage (nominal 240 V)
      - name: "Sim AC Voltage V"
        unique_id: sim_ac_voltage_v
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        state: "239.8"
        icon: mdi:sine-wave

      # UPS battery (85% for dev)
      - name: "Sim UPS Battery Pct"
        unique_id: sim_ups_battery_pct
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        state: "85"
        icon: mdi:battery-80

      # Elevator floor (idle at Ground)
      - name: "Sim Elevator Floor"
        unique_id: sim_elevator_floor
        state: "Ground"
        icon: mdi:elevator

  - binary_sensor:
      # Inverter fault — always OK in dev
      - name: "Sim Inverter Fault"
        unique_id: sim_inverter_fault
        device_class: problem
        state: "off"
      # PIR zones — clear in dev
      - name: "Sim PIR Zone 1"
        unique_id: sim_pir_zone_1
        device_class: motion
        state: "off"
      - name: "Sim PIR Zone 2"
        unique_id: sim_pir_zone_2
        device_class: motion
        state: "off"

# ── Input helpers ─────────────────────────────────────────────────────────────
input_select:
  cooling_mode:
    name: Cooling Mode
    options:
      - cooling
      - monsoon_bypass
      - winter_bypass
      - "off"
    initial: "off"
    icon: mdi:air-filter

input_number:
  cooling_rh_bypass_threshold:
    name: "RH Bypass Threshold (%)"
    initial: 65
    min: 50
    max: 85
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  cooling_min_temp_threshold:
    name: "Winter Bypass Below (°C)"
    initial: 18
    min: 10
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake

  rwh_low_level_threshold:
    name: "RWH Low Alert Level (%)"
    initial: 10
    min: 5
    max: 30
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-alert

  rwh_beehive_cut_threshold:
    name: "RWH Beehive Cut Level (%)"
    initial: 15
    min: 10
    max: 40
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-minus

input_boolean:
  automation_cooling_enabled:
    name: "Auto Cooling Control"
    initial: true
    icon: mdi:air-filter
  automation_rwh_enabled:
    name: "Auto RWH Pump Control"
    initial: true
    icon: mdi:pump
  automation_security_enabled:
    name: "Auto Security Alerts"
    initial: true
    icon: mdi:shield-home

# ── Utility meters (daily reset) ─────────────────────────────────────────────
utility_meter:
  daily_domestic_water:
    source: sensor.rwh_domestic_flow_lpm
    cycle: daily
  daily_beehive_water:
    source: sensor.rwh_beehive_flow_lpm
    cycle: daily
  daily_pv_energy:
    source: sensor.daily_pv_kwh
    cycle: daily
  daily_grid_import:
    source: sensor.daily_grid_import_kwh
    cycle: daily
