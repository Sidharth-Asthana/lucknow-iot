# Home Assistant — Main Configuration
# Lucknow Smart Residence · Mac Mini A · 10.0.0.10
# Place this file at: volumes/ha_config/configuration.yaml

homeassistant:
  name: "Lucknow Smart Residence"
  latitude: 26.8467
  longitude: 80.9462
  elevation: 123        # metres ASL
  unit_system: metric
  currency: INR
  country: IN
  time_zone: Asia/Kolkata
  external_url: "http://10.0.0.10:8123"

# ── Core integrations loaded by default ──────────────────────────────────────
default_config:          # includes frontend, history, logbook, map, mobile_app, etc.

# ── Split configs ─────────────────────────────────────────────────────────────
modbus: !include modbus.yaml
mqtt:   !include mqtt_sensors.yaml
automation: !include_dir_merge_list automations/
script:     !include scripts.yaml

# ── KNX (wired backbone — Weinzierl KNX IP Router 750) ───────────────────────
knx:
  tunneling:
    host: "10.0.0.20"    # static IP of Weinzierl KNX IP Router on LAN
    port: 3671
    local_ip: "10.0.0.10"

# ── Konnected Alarm Panels ────────────────────────────────────────────────────
# Konnected Pro #1: PIR × 8 + IR beam-break × 4 + siren + gate relay
# Konnected Pro #2: Elevator reed switches × 3 + door + fault + call relays × 3
konnected:
  - id: "panel_1_security"
    host: "10.0.0.30"    # static IP of Konnected Pro #1
    port: 6437
    binarysensors:
      - zone: "1"
        type: motion
        name: PIR Gate
        device_class: motion
      - zone: "2"
        type: motion
        name: PIR Driveway
        device_class: motion
      - zone: "3"
        type: motion
        name: PIR Front Door
        device_class: motion
      - zone: "4"
        type: motion
        name: PIR Living Room
        device_class: motion
      - zone: "5"
        type: motion
        name: PIR Dining
        device_class: motion
      - zone: "6"
        type: motion
        name: PIR Terrace
        device_class: motion
      - zone: "7"
        type: motion
        name: PIR Garage
        device_class: motion
      - zone: "8"
        type: motion
        name: PIR Master Bedroom
        device_class: motion
      - zone: "9"
        type: opening
        name: IR Beam West Gate
        device_class: door
      - zone: "10"
        type: opening
        name: IR Beam West Driveway
        device_class: door
      - zone: "11"
        type: opening
        name: IR Beam NE Perimeter
        device_class: door
      - zone: "12"
        type: opening
        name: IR Beam SW Perimeter
        device_class: door
    switches:
      - zone: "alarm1"
        name: Siren
      - zone: "alarm2"
        name: Gate Lock Relay

  - id: "panel_2_elevator"
    host: "10.0.0.31"    # static IP of Konnected Pro #2
    port: 6437
    binarysensors:
      - zone: "1"
        type: opening
        name: Elevator At Ground
        device_class: occupancy
      - zone: "2"
        type: opening
        name: Elevator At First
        device_class: occupancy
      - zone: "3"
        type: opening
        name: Elevator At Terrace
        device_class: occupancy
      - zone: "4"
        type: opening
        name: Elevator Door Open
        device_class: door
      - zone: "5"
        type: problem
        name: Elevator Fault
        device_class: problem
    switches:
      - zone: "alarm1"
        name: Elevator Call Ground
      - zone: "alarm2"
        name: Elevator Call First
      - zone: "alarm3"
        name: Elevator Call Terrace

# ── NUT (UPS — APC Back-UPS 1500VA on USB) ───────────────────────────────────
nut:
  host: localhost
  resources:
    - battery.charge
    - battery.runtime
    - ups.load
    - ups.status
  alias: "apc_1500"

# ── Alarm Control Panel ───────────────────────────────────────────────────────
alarm_control_panel:
  - platform: manual
    name: Main Alarm
    code_arm_required: false
    disarm_after_trigger: false
    arming_time: 30          # 30 s exit delay
    delay_time: 20           # 20 s entry grace
    trigger_time: 300        # siren runs for 5 min max

# ── Template sensors ──────────────────────────────────────────────────────────
template:
  - sensor:
      # Elevator floor — derives a friendly string from Konnected zone states
      - name: "Elevator Floor"
        unique_id: elevator_floor
        state: >
          {% if is_state('binary_sensor.elevator_at_ground', 'on') %}
            Ground
          {% elif is_state('binary_sensor.elevator_at_first', 'on') %}
            First
          {% elif is_state('binary_sensor.elevator_at_terrace', 'on') %}
            Terrace
          {% else %}
            In Transit
          {% endif %}
        icon: mdi:elevator

      # Cooling delta — outdoor minus beehive inlet temperature
      - name: "Cooling Delta C"
        unique_id: cooling_delta_c
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set outdoor = states('sensor.outdoor_temp_c') | float(0) %}
          {% set inlet   = states('sensor.beehive_inlet_temp_c') | float(0) %}
          {{ (outdoor - inlet) | round(1) }}
        icon: mdi:thermometer-lines

      # RWH level in litres
      - name: "RWH Level Litres"
        unique_id: rwh_level_litres
        unit_of_measurement: "L"
        state: >
          {{ (states('sensor.rwh_level_pct') | float(0) / 100 * 18000) | round(0) | int }}
        icon: mdi:water

  - binary_sensor:
      - name: "RWH Low Level"
        unique_id: rwh_low_level
        device_class: problem
        state: "{{ states('sensor.rwh_level_pct') | float(100) < 10 }}"

# ── Input helpers ─────────────────────────────────────────────────────────────
input_select:
  cooling_mode:
    name: Cooling Mode
    options:
      - cooling
      - monsoon_bypass
      - winter_bypass
      - "off"
    initial: "off"
    icon: mdi:air-filter

input_number:
  cooling_rh_bypass_threshold:
    name: "RH Bypass Threshold (%)"
    initial: 65
    min: 50
    max: 85
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  cooling_min_temp_threshold:
    name: "Winter Bypass Below (°C)"
    initial: 18
    min: 10
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake

  rwh_low_level_threshold:
    name: "RWH Low Alert Level (%)"
    initial: 10
    min: 5
    max: 30
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-alert

  rwh_beehive_cut_threshold:
    name: "RWH Beehive Cut Level (%)"
    initial: 15
    min: 10
    max: 40
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-minus

input_boolean:
  automation_cooling_enabled:
    name: "Auto Cooling Control"
    initial: true
    icon: mdi:air-filter
  automation_rwh_enabled:
    name: "Auto RWH Pump Control"
    initial: true
    icon: mdi:pump
  automation_security_enabled:
    name: "Auto Security Alerts"
    initial: true
    icon: mdi:shield-home

# ── Utility meters (daily reset) ─────────────────────────────────────────────
utility_meter:
  daily_domestic_water:
    source: sensor.rwh_domestic_flow_lpm
    cycle: daily
  daily_beehive_water:
    source: sensor.rwh_beehive_flow_lpm
    cycle: daily
  daily_pv_energy:
    source: sensor.daily_pv_kwh
    cycle: daily
  daily_grid_import:
    source: sensor.daily_grid_import_kwh
    cycle: daily
