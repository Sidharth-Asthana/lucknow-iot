# docker-compose.dev.yml
# ─────────────────────────────────────────────────────────────────────────────
# Windows / local dev override — NO hardware required.
# Runs only HA + Mosquitto. Frigate and wiegand_bridge are no-ops.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# HA will be at:   http://localhost:8123
# MQTT broker at:  localhost:1883
# ─────────────────────────────────────────────────────────────────────────────

services:

  homeassistant:
    # Drop host networking — doesn't work on Windows Docker Desktop.
    # Explicit port mapping works everywhere.
    network_mode: ""
    ports:
      - "8123:8123"
    # HA only needs Mosquitto for dev; no Frigate dependency
    depends_on:
      - mosquitto
    environment:
      - TZ=Asia/Kolkata

  # Mosquitto is unchanged — ports already exposed in base file
  mosquitto: {}

  # Frigate and wiegand_bridge need cameras/serial port — replace with
  # a busybox container that exits immediately (no-op, no errors).
  frigate:
    image: busybox
    command: ["true"]
    restart: "no"
    ports: []
    volumes: []
    environment: []
    shm_size: "1mb"

  wiegand_bridge:
    image: busybox
    command: ["true"]
    restart: "no"
    volumes: []
    environment: []
    depends_on: []

  # ── MQTT Simulator ────────────────────────────────────────────────────────────
  # Publishes realistic sensor data every 10 s — populates all MQTT entities
  # without requiring ESP32 hardware. Disable for production (hw.yml).
  simulator:
    build:
      context: ./scripts
      dockerfile: Dockerfile.simulator
    restart: unless-stopped
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - SIM_INTERVAL=10
    depends_on:
      - mosquitto
    networks:
      - default
