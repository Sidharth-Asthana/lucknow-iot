<!DOCTYPE html>

<body>

<text x="310" y="313"  text-anchor="middle" class="node-sublabel">10.0.0.51 · paho-mqtt</text>

<text x="542" y="297"  text-anchor="middle" class="node-label" font-size="13" font-weight="600">Home Assistant</text>
<text x="542" y="313"  text-anchor="middle" class="node-sublabel">automation.rwh_pump</text>

<text x="309" y="442"  text-anchor="middle" class="node-label" font-size="12" font-weight="600">Domestic Valve</text>
<text x="309" y="458"  text-anchor="middle" class="node-sublabel">UV + sediment filter</text>

<text x="410" y="347" text-anchor="middle" class="wire-label" fill="#f0a500">HA switch control</text>

<text id="tank-litres" x="512" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">-- L</text>

</svg>
</div>

<div class="data-panel">
  <div class="data-panel-title">Live Simulated Values · updates every 2 s</div>
  <div class="data-grid">
    <div class="data-cell"><div class="data-label">🛢️ Tank Level</div>
      <div class="data-value blue" id="d-level">-- %</div></div>
    <div class="data-cell"><div class="data-label">📦 Volume</div>
      <div class="data-value blue" id="d-litres">-- L</div></div>
    <div class="data-cell"><div class="data-label">🚰 Dom. Flow</div>
      <div class="data-value normal" id="d-flow-dom">-- L/min</div></div>
    <div class="data-cell"><div class="data-label">🌿 Beehive Flow</div>
      <div class="data-value green" id="d-flow-bh">-- L/min</div></div>
    <div class="data-cell"><div class="data-label">⚙️ Pump</div>
      <div class="data-value amber" id="d-pump">--</div></div>
    <div class="data-cell"><div class="data-label">🔵 Dom. Valve</div>
      <div class="data-value cyan" id="d-valve-dom">--</div></div>
    <div class="data-cell"><div class="data-label">🟢 BH Valve</div>
      <div class="data-value green" id="d-valve-bh">--</div></div>
    <div class="data-cell"><div class="data-label">⚠️ Alert</div>
      <div class="data-value green" id="d-alert">None</div></div>
  </div>
</div>

<script>
let level=65;
function noise(a){return (Math.random()-.5)*2*a;}
function update(){
  const now=new Date();
  document.getElementById('ts').textContent=now.toLocaleTimeString();
  level+=noise(0.3)-0.12;
  if(level<20) level=80;
  level=Math.max(5,Math.min(100,level));
  const litres=Math.round(level/100*18000);
  const pumpOn=level<25||Math.random()>0.85;
  const domOn=Math.random()>0.4;
  const bhOn=level>15&&Math.random()>0.6;
  const domFlow=domOn?(1.2+noise(0.4)).toFixed(1):'0.0';
  const bhFlow =bhOn ?(0.4+noise(0.15)).toFixed(2):'0.00';
  const alert=level<10?'LOW LEVEL':'None';
  document.getElementById('tank-bar').setAttribute('width',Math.round(1.49*level));
  document.getElementById('tank-pct').textContent=Math.round(level)+' %';
  document.getElementById('tank-litres').textContent=litres.toLocaleString()+' L';
  document.getElementById('d-level').textContent=Math.round(level)+' %';
  document.getElementById('d-litres').textContent=litres.toLocaleString()+' L';
  document.getElementById('d-flow-dom').textContent=domFlow+' L/min';
  document.getElementById('d-flow-bh').textContent=bhFlow+' L/min';
  document.getElementById('d-pump').textContent=pumpOn?'ON':'OFF';
  document.getElementById('d-valve-dom').textContent=domOn?'OPEN':'CLOSED';
  document.getElementById('d-valve-bh').textContent=bhOn?'OPEN':'CLOSED';
  document.getElementById('d-alert').textContent=alert;
  document.getElementById('d-flow-both').textContent='Dom: '+domFlow+' · BH: '+bhFlow;
  const b=document.getElementById('status-badge');
  if(level<10){b.className='status-badge red';document.getElementById('status-text').textContent='LOW LEVEL';}
  else if(pumpOn){b.className='status-badge amber';document.getElementById('status-text').textContent='Pump Running';}
  else{b.className='status-badge green';document.getElementById('status-text').textContent='Normal';}
}
update(); setInterval(update,2000);
</script>
</body>
