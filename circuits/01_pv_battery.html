<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV + Battery — Circuit Diagram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <a href="index.html" class="back">←</a>
  <h1>⚡ System 01 — PV Array + Battery Storage</h1>
  <span class="timestamp" id="ts">--</span>
  <span class="status-badge green" id="status-badge"><span class="dot"></span><span id="status-text">Charging</span></span>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-line amber"></div> DC / AC Power</div>
  <div class="legend-item"><div class="legend-line cyan"></div> Modbus / RS485 Data</div>
  <div class="legend-item"><div class="legend-line red"></div> Fault / Alert</div>
</div>

<div class="svg-wrap">
<svg class="circuit-svg" viewBox="0 0 800 490" width="800" height="490" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="a-am" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#f0a500"/></marker>
  <marker id="a-cy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00d4ff"/></marker>
  <marker id="a-gn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#39d353"/></marker>
  <marker id="a-am-r" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#f0a500"/></marker>
  <marker id="a-cy-r" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#00d4ff"/></marker>
</defs>

<rect x="0" y="0" width="800" height="490" fill="#0d1117"/>

<!-- ── Zone labels ───────────────────────────────────── -->
<rect x="8" y="8" width="784" height="296" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="22" y="26" fill="#8b949e" font-size="10" font-family="monospace">POWER LAYER</text>

<rect x="8" y="314" width="784" height="168" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="22" y="332" fill="#8b949e" font-size="10" font-family="monospace">DATA / CONTROL LAYER</text>

<!-- ══════════════════════════════════════════════════ -->
<!--  NODE BOXES                                        -->
<!--  Row 1  y=42–122  (center y=82)                   -->
<!--  Row 2  y=200–285 (center y=242)                  -->
<!--  Data   y=345–425                                  -->
<!-- ══════════════════════════════════════════════════ -->

<!-- PV Array  x=20-165 -->
<rect x="20" y="42" width="145" height="80" rx="8" fill="#161b22" stroke="#f0a500" stroke-width="1.5"/>
<text x="92"  y="68"  text-anchor="middle" font-size="20" fill="#f0a500">☀️</text>
<text x="92"  y="86"  text-anchor="middle" class="node-label" font-size="13" font-weight="600">PV Array</text>
<text x="92"  y="102" text-anchor="middle" class="node-sublabel">6 kWp · 15 × 400 W · 25° S</text>
<text id="pv-w" x="92" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#f0a500">-- W</text>

<!-- Hybrid Inverter  x=245-425 -->
<rect x="245" y="42" width="180" height="80" rx="8" fill="#161b22" stroke="#f0a500" stroke-width="1.5"/>
<text x="335" y="68"  text-anchor="middle" font-size="20" fill="#f0a500">⚡</text>
<text x="335" y="86"  text-anchor="middle" class="node-label" font-size="13" font-weight="600">Hybrid Inverter</text>
<text x="335" y="102" text-anchor="middle" class="node-sublabel">5 kW MPPT · SunSpec Modbus</text>
<text id="inv-w" x="335" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#f0a500">-- W out</text>

<!-- AC Distribution Panel  x=500-665 -->
<rect x="500" y="42" width="165" height="80" rx="8" fill="#161b22" stroke="#f0a500" stroke-width="1.5"/>
<text x="582" y="68"  text-anchor="middle" font-size="20" fill="#f0a500">🔌</text>
<text x="582" y="86"  text-anchor="middle" class="node-label" font-size="13" font-weight="600">AC Panel</text>
<text x="582" y="102" text-anchor="middle" class="node-sublabel">240 V · Crit + Gen circuits</text>

<!-- LFP Battery  x=245-425 -->
<rect x="245" y="200" width="180" height="85" rx="8" fill="#161b22" stroke="#f0a500" stroke-width="1.5"/>
<text x="335" y="226" text-anchor="middle" font-size="20" fill="#f0a500">🔋</text>
<text x="335" y="244" text-anchor="middle" class="node-label" font-size="13" font-weight="600">LFP Battery</text>
<text x="335" y="260" text-anchor="middle" class="node-sublabel">12 kWh · 2 × 6 kWh modules</text>
<rect x="254" y="272" width="162" height="6" rx="3" fill="#30363d"/>
<rect id="soc-bar" x="254" y="272" width="100" height="6" rx="3" fill="#f0a500"/>
<text id="soc-txt" x="335" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#f0a500">SOC ---%</text>

<!-- Grid  x=500-665 -->
<rect x="500" y="200" width="165" height="85" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="582" y="225" text-anchor="middle" font-size="20" fill="#58a6ff">🏗️</text>
<text x="582" y="243" text-anchor="middle" class="node-label" font-size="13" font-weight="600">Grid / DISCOM</text>
<text x="582" y="259" text-anchor="middle" class="node-sublabel">Eastron SDM630 · RS485</text>
<text id="grid-w" x="582" y="295" text-anchor="middle" font-size="11" font-weight="700" fill="#58a6ff">Import/Export -- W</text>

<!-- Home Assistant  x=20-185 -->
<rect x="20" y="345" width="165" height="70" rx="8" fill="#161b22" stroke="#00d4ff" stroke-width="1.5"/>
<text x="102" y="369" text-anchor="middle" font-size="18" fill="#00d4ff">🏠</text>
<text x="102" y="387" text-anchor="middle" class="node-label" font-size="13" font-weight="600">Home Assistant</text>
<text x="102" y="403" text-anchor="middle" class="node-sublabel">Mac Mini A · 10.0.0.10</text>

<!-- Critical Loads  x=385-540 -->
<rect x="385" y="345" width="155" height="70" rx="8" fill="#161b22" stroke="#39d353" stroke-width="1.5"/>
<text x="462" y="369" text-anchor="middle" font-size="18" fill="#39d353">🔒</text>
<text x="462" y="387" text-anchor="middle" class="node-label" font-size="13" font-weight="600">Critical Loads</text>
<text x="462" y="403" text-anchor="middle" class="node-sublabel">Security · HA · ~600 W</text>

<!-- General Loads  x=555-720 -->
<rect x="555" y="345" width="165" height="70" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
<text x="637" y="369" text-anchor="middle" font-size="18" fill="#8b949e">💡</text>
<text x="637" y="387" text-anchor="middle" class="node-label" font-size="13" font-weight="600">General Loads</text>
<text x="637" y="403" text-anchor="middle" class="node-sublabel">Lights · Kitchen · AC</text>

<!-- ══════════════════════════════════════════════════ -->
<!--  WIRES — no path segment passes through any box   -->
<!-- ══════════════════════════════════════════════════ -->

<!-- W1 · PV → Inverter  (gap x=165–245, wire at y=82) -->
<path d="M 165,82 L 245,82" stroke-width="2.5" fill="none"
      marker-end="url(#a-am)" class="wire-amber"/>
<!-- label sits in the gap, 12 px above wire -->
<text x="205" y="72" text-anchor="middle" class="wire-label">DC cable</text>

<!-- W2 · Inverter → AC Panel  (gap x=425–500, wire at y=82) -->
<path d="M 425,82 L 500,82" stroke-width="2.5" fill="none"
      marker-end="url(#a-am)" class="wire-amber"/>
<text x="462" y="72" text-anchor="middle" class="wire-label">AC 240 V</text>

<!-- W3a · Inverter ↓ Battery  (charge; vertical in row gap, x=320) -->
<path d="M 320,122 L 320,200" stroke-width="2.5" fill="none"
      marker-end="url(#a-am)" class="wire-amber"/>
<!-- W3b · Battery → Inverter  (discharge; x=350, reverse) -->
<path d="M 350,200 L 350,122" stroke-width="2" fill="none"
      stroke="#f0a500" stroke-dasharray="6 5"
      marker-end="url(#a-am)" style="animation:flow-fwd 0.9s linear infinite; opacity:0.55;"/>
<!-- label in LEFT corridor (x 165–245, y 155–175 = mid gap) — clear of all boxes -->
<text x="205" y="157" text-anchor="middle" class="wire-label">DC Bus</text>
<text x="205" y="170" text-anchor="middle" class="wire-label">charge ↓</text>
<text x="205" y="183" text-anchor="middle" class="wire-label">discharge ↑</text>

<!-- W4 · AC Panel ↔ Grid  (vertical, x=567/582, gap y=122–200) -->
<!-- import: down -->
<path d="M 567,122 L 567,200" stroke-width="2.5" fill="none"
      marker-end="url(#a-am)" class="wire-amber"/>
<!-- export: up -->
<path d="M 582,200 L 582,122" stroke-width="2" fill="none"
      stroke="#58a6ff" stroke-dasharray="6 5"
      marker-end="url(#a-cy)" style="animation:flow-rev 0.9s linear infinite; opacity:0.6;"/>
<!-- label in RIGHT margin (x=672, gap y=122–200) — clears AC Panel right x=665 -->
<text x="675" y="152" text-anchor="start" class="wire-label">Import ↓</text>
<text x="675" y="168" text-anchor="start" class="wire-label">Export ↑</text>

<!-- W5 · AC Panel → Critical + General
     Route: right edge of AC Panel (665,82) → right margin x=755 (> Gen right 720)
     → down to bus y=328 (< loads top 345) → branch left to each load.
     No segment touches any node box. -->
<path d="M 665,82 L 755,82 L 755,328 L 462,328 L 462,345"
      stroke-width="2.5" fill="none" marker-end="url(#a-am)" class="wire-amber"/>
<!-- branch to General (from bus junction at 755,328 left to 637,328 then down) -->
<path d="M 755,328 L 637,328 L 637,345" stroke-width="2" fill="none"
      stroke="#f0a500" stroke-dasharray="7 5"
      style="animation:flow-fwd 0.45s linear infinite;" marker-end="url(#a-am)"/>
<!-- bus labels in the horizontal corridor y=328 — between node boxes -->
<text x="690" y="320" text-anchor="middle" class="wire-label">→ Crit</text>
<text x="778" y="320" text-anchor="middle" class="wire-label">→ Gen</text>

<!-- W6 · Inverter → HA  (Modbus TCP)
     Route: left edge of Inverter (245,102) → left corridor x=195 (>PV right 165 + 30)
     → down to y=330 (< loads top 345, > Grid bottom 285) → left to HA top x=102 -->
<path d="M 245,102 L 195,102 L 195,330 L 102,330 L 102,345"
      stroke-width="1.5" fill="none" marker-end="url(#a-cy)" class="wire-cyan"
      style="animation-duration:0.9s;"/>
<!-- label on the horizontal segment at y=102, placed well above in the corridor -->
<text x="218" y="93" text-anchor="middle" class="wire-label" fill="#00d4ff">Modbus TCP</text>

<!-- W7 · Grid/SDM630 → HA  (RS485 → Modbus RTU)
     Route: left edge of Grid (500,250) → left to x=450 (> Battery right 425 + 25)
     → down to y=310 (> Grid bottom 285, < loads top 345)
     → left to x=210 (slightly right of Modbus corridor x=195)
     → down to y=330, then left to HA.
     All segments stay in clear corridors. -->
<path d="M 500,250 L 450,250 L 450,310 L 210,310 L 210,330 L 145,330 L 145,345"
      stroke-width="1.5" fill="none" stroke="#00d4ff" stroke-dasharray="4 8"
      marker-end="url(#a-cy)" style="animation:flow-fwd 1.1s linear infinite;"/>
<!-- label on long horizontal at y=310 — sits in the clear corridor -->
<text x="340" y="302" text-anchor="middle" class="wire-label" fill="#00d4ff">RS485 / SDM630</text>

<!-- W8 · HA → Inverter  (grid_export_enable control)
     Route: top of HA at x=155 → up through left corridor x=220 → into Inverter left side.
     Uses x=220 — distinct from Modbus at x=195, 25 px clearance. -->
<path d="M 155,345 L 155,340 L 220,340 L 220,122 L 245,122"
      stroke-width="1.5" fill="none" stroke="#00d4ff" stroke-dasharray="3 9"
      marker-end="url(#a-cy)" style="animation:flow-rev 1.4s linear infinite; opacity:0.65;"/>
<text x="232" y="134" text-anchor="start" class="wire-label" fill="#00d4ff">grid_export ctrl</text>

<!-- ── Live value overlays (placed BELOW their respective boxes, y=136 / y=295) ── -->
</svg>
</div>

<div class="data-panel">
  <div class="data-panel-title">Live Simulated Values · updates every 2 s</div>
  <div class="data-grid">
    <div class="data-cell"><div class="data-label">☀️ PV Output</div>
      <div class="data-value amber" id="d-pv">-- W</div></div>
    <div class="data-cell"><div class="data-label">🔋 Battery SOC</div>
      <div class="data-value amber" id="d-soc">-- %</div></div>
    <div class="data-cell"><div class="data-label">⚡ Inverter Output</div>
      <div class="data-value amber" id="d-inv">-- W</div></div>
    <div class="data-cell"><div class="data-label">AC Voltage</div>
      <div class="data-value normal" id="d-vac">-- V</div></div>
    <div class="data-cell"><div class="data-label">🏗️ Grid Import</div>
      <div class="data-value blue" id="d-imp">-- W</div></div>
    <div class="data-cell"><div class="data-label">↗️ Grid Export</div>
      <div class="data-value green" id="d-exp">-- W</div></div>
    <div class="data-cell"><div class="data-label">⚙️ Mode</div>
      <div class="data-value cyan" id="d-mode">--</div></div>
    <div class="data-cell"><div class="data-label">🚨 Fault</div>
      <div class="data-value green" id="d-fault">None</div></div>
  </div>
</div>

<script>
function noise(a){ return (Math.random()-.5)*2*a; }
function pvPower(h){
  if(h<6||h>18) return 0;
  const x=(h-12)/5.5;
  return Math.max(0,5800*(1-x*x)+noise(120));
}
function batterySoc(h){
  if(h>=6&&h<=15) return Math.min(98,45+(h-6)*5.5+noise(1));
  const e=h>15?h-15:h+9;
  return Math.max(20,94-e*3.8+noise(1));
}
function update(){
  const now=new Date();
  const h=now.getHours()+now.getMinutes()/60;
  document.getElementById('ts').textContent=now.toLocaleTimeString();
  const pv=Math.round(pvPower(h));
  const soc=Math.round(batterySoc(h));
  const inv=Math.round(pv*0.96+noise(80));
  const base=1200+noise(150);
  const imp=pv>base?0:Math.round(base-pv+noise(50));
  const exp=pv>base+400?Math.round(pv-base-noise(80)):0;
  const vac=238+noise(3);
  const mode=pv>200?(soc<80?'Charging':'Export'):(soc>30?'Discharging':'Grid Import');
  document.getElementById('pv-w').textContent=pv.toLocaleString()+' W';
  document.getElementById('inv-w').textContent=inv.toLocaleString()+' W out';
  document.getElementById('soc-txt').textContent='SOC '+soc+'%';
  document.getElementById('soc-bar').setAttribute('width',Math.round(1.62*soc));
  document.getElementById('grid-w').textContent=(imp>0?'Import '+imp:'Export '+exp)+' W';
  document.getElementById('d-pv').textContent=pv.toLocaleString()+' W';
  document.getElementById('d-soc').textContent=soc+' %';
  document.getElementById('d-inv').textContent=inv.toLocaleString()+' W';
  document.getElementById('d-vac').textContent=vac.toFixed(1)+' V';
  document.getElementById('d-imp').textContent=imp+' W';
  document.getElementById('d-exp').textContent=exp+' W';
  document.getElementById('d-mode').textContent=mode;
  const b=document.getElementById('status-badge');
  b.className='status-badge '+(pv>500?'green':'amber');
  document.getElementById('status-text').textContent=mode;
}
update(); setInterval(update,2000);
</script>
</body>
</html>
