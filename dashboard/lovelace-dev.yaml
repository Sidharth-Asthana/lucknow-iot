    icon: mdi:flask
    cards:
      - type: markdown
        content: |
          ## 🧪 Test Scenarios
          Trigger HA scripts that inject MQTT payloads simulating each operating condition.
          Watch the Water and Cooling tabs update within 10 seconds.

      - type: button
        name: "🌞 Normal Summer"
        icon: mdi:weather-sunny
        tap_action:
          action: call-service
          service: script.turn_on
          target:
