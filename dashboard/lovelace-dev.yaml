          service: script.turn_on
          target:
            entity_id: script.scenario_winter_bypass

      - type: button
        name: "💧 Low Water"
        icon: mdi:water-alert
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.scenario_low_water

      - type: button
        name: "⚡ Power Outage"
        icon: mdi:power-plug-off
        tap_action:
          action: call-service
          service: script.turn_on
          target:
            entity_id: script.scenario_power_outage

      - type: entities
        title: "Live Simulator State"
        entities:
          - entity: sensor.outdoor_temp_c
          - entity: sensor.indoor_rh_pct
          - entity: sensor.rwh_level_pct
