          - entity: sensor.sim_battery_soc_pct

# ═══════════════════════════════════════════════════════════════════════════════
# 9 · GUIDE
# ═══════════════════════════════════════════════════════════════════════════════
  - title: Guide
    path: guide
    icon: mdi:book-open
    cards:
      - type: markdown
        content: |
          # Lucknow Smart Residence — Quick Guide

          ## Dev Mode (this dashboard)
          - **Simulator** publishes MQTT data every 10 s — all sensor values are synthetic
          - **sim_*** entities are template sensors based on time-of-day (no hardware needed)
          - Switch to `lovelace.yaml` on Mac Mini A production for HACS cards + real entities

          ## System Overview
          | System | Status | Notes |
          |--------|--------|-------|
          | PV + Battery | ✅ Simulated | 6 kWp / 12 kWh LFP |
          | Rainwater Harvest | ✅ MQTT live | ESP32 RWH node |
          | Beehive Cooling | ✅ MQTT live | ESP32 Beehive node |
          | Security | ⚠️ Dev stub | Real cameras need Frigate |
          | Access Control | ✅ MQTT live | Simulated access events |
          | Elevator | ⚠️ Dev stub | Konnected on Mac Mini A |

          ## Cooling Modes
          | Mode | Trigger | Action |
          |------|---------|--------|
          | `cooling` | RH < 65%, T > 26°C | Dampers open, fans run |
          | `monsoon_bypass` | Indoor RH > 65% | Dampers closed, fans off |
          | `winter_bypass` | Outdoor T < 18°C | Passive solar only |
          | `off` | Manual | All off |

          ## IP Addresses
          | Device | IP |
          |--------|----|
          | Mac Mini A (HA) | 10.0.0.10 |
          | Hybrid Inverter | 10.0.0.40 |
          | Beehive ESP32 | 10.0.0.50 |
          | RWH ESP32 | 10.0.0.51 |

          ## Useful Commands
          ```bash
          # Start dev stack
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

          # Watch simulator output
          docker logs -f lucknow_iot_simulator_1

          # Inject MQTT manually
          mosquitto_pub -h localhost -t homeassistant/sensor/rwh/level -m '{"value": 42.0}'
          ```
