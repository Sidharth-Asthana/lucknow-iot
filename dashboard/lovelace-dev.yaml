# Lucknow Smart Residence — Dev Dashboard
# ─────────────────────────────────────────────────────────────────────────────
# Built-in HA cards ONLY — no HACS required.
# Uses sim_* template sensors (configuration.yaml) + MQTT entities (simulator.py).
# Zero "Configuration error" or "Entity not found" when running dev stack.
#
# Usage:
#   cp dashboard/lovelace-dev.yaml volumes/ha_config/ui-lovelace.yaml
#   (setup.sh does this automatically for dev mode)
#
# Production: cp dashboard/lovelace.yaml volumes/ha_config/ui-lovelace.yaml
# ─────────────────────────────────────────────────────────────────────────────

title: "Lucknow Smart Residence"

views:

# ═══════════════════════════════════════════════════════════════════════════════
# 1 · OVERVIEW
# ═══════════════════════════════════════════════════════════════════════════════
  - title: Overview
    path: overview
    icon: mdi:home
    cards:
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.sim_pv_power_w
            name: "PV Power"
            icon: mdi:solar-power
          - type: entity
            entity: sensor.sim_battery_soc_pct
            name: "Battery"
            icon: mdi:battery-charging
          - type: entity
            entity: sensor.rwh_level_pct
            name: "Tank Level"
            icon: mdi:water-percent

      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.indoor_temp_c
            name: "Indoor"
            icon: mdi:thermometer
          - type: entity
            entity: sensor.outdoor_temp_c
            name: "Outdoor"
            icon: mdi:weather-sunny
          - type: entity
            entity: sensor.indoor_rh_pct
            name: "Indoor RH"
            icon: mdi:water-percent

      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.sim_elevator_floor
            name: "Elevator"
            icon: mdi:elevator
          - type: entity
            entity: sensor.panel_access_last_user
            name: "Last Access"
            icon: mdi:fingerprint
          - type: entity
            entity: sensor.sim_ups_battery_pct
            name: "UPS"
            icon: mdi:battery-80

      - type: alarm-panel
        entity: alarm_control_panel.main_alarm
        name: "Security Alarm"
        states:
          - armed_away
          - armed_home

# ═══════════════════════════════════════════════════════════════════════════════
# 2 · ENERGY
# ═══════════════════════════════════════════════════════════════════════════════
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: sensor
                entity: sensor.sim_pv_power_w
                name: "PV Output"
                graph: line
                hours_to_show: 12
              - type: sensor
                entity: sensor.sim_battery_soc_pct
                name: "Battery SOC"
                graph: line
                hours_to_show: 12

          - type: horizontal-stack
            cards:
              - type: sensor
                entity: sensor.sim_grid_import_w
                name: "Grid Import"
                graph: line
                hours_to_show: 12
              - type: sensor
                entity: sensor.sim_grid_export_w
                name: "Grid Export"
                graph: line
                hours_to_show: 12

          - type: history-graph
            title: "24-Hour Power"
            hours_to_show: 24
            entities:
              - entity: sensor.sim_pv_power_w
                name: PV
              - entity: sensor.sim_inverter_ac_output_w
                name: Inverter
              - entity: sensor.sim_grid_import_w
                name: Import
              - entity: sensor.sim_grid_export_w
                name: Export

          - type: entities
            title: "Power Status"
            entities:
              - entity: sensor.sim_ac_voltage_v
                name: "AC Voltage"
              - entity: sensor.sim_inverter_ac_output_w
                name: "Inverter Output"
              - entity: binary_sensor.sim_inverter_fault
                name: "Inverter Fault"

# ═══════════════════════════════════════════════════════════════════════════════
# 3 · WATER
# ═══════════════════════════════════════════════════════════════════════════════
  - title: Water
    path: water
    icon: mdi:water
    cards:
      - type: gauge
        entity: sensor.rwh_level_pct
        name: "Tank Level"
        min: 0
        max: 100
        severity:
          green: 30
          yellow: 15
          red: 0

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.rwh_level_pct
            name: "Tank %"
            graph: line
            hours_to_show: 24
          - type: sensor
            entity: sensor.rwh_level_litres
            name: "Litres"

      - type: horizontal-stack
        cards:
          - type: sensor
            entity: sensor.rwh_domestic_flow_lpm
            name: "Domestic Flow"
            graph: line
            hours_to_show: 6
          - type: sensor
            entity: sensor.rwh_beehive_flow_lpm
            name: "Beehive Flow"
            graph: line
            hours_to_show: 6

      - type: entities
        title: "Valves & Pump"
        entities:
          - entity: switch.rwh_valve_domestic
            name: "Domestic Valve"
          - entity: switch.rwh_valve_beehive
            name: "Beehive Valve"

      - type: history-graph
        title: "Tank Level — 24 hr"
        hours_to_show: 24
        entities:
          - entity: sensor.rwh_level_pct
            name: "Level %"

