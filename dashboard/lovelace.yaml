          ## 🐛 Troubleshooting

          | Symptom | Likely cause | Fix |
          |---------|-------------|-----|
          | HA not at localhost:8123 | Using production compose (network_mode:host) | Add `-f docker-compose.dev.yml` to docker compose command |
          | Sensors show "unavailable" | Config copied but HA not restarted | `docker compose restart homeassistant` |
          | Automations don't fire | Sensor entity names don't match config | Check Developer Tools → States for actual entity IDs |
          | HACS cards show "custom element not found" | HACS cards not installed | Install via HACS, clear browser cache |
          | Mosquitto not reachable | mosquitto.conf missing | Re-run `bash scripts/setup.sh` |
